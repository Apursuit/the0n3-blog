<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="无字母数字 RCE Payload 在线生成：用 ~ 取反、^ 异或、| 或运算，从可见字符拼出被过滤的字母数字，绕开字母数字过滤执行 PHP 代码。" />
  <title>无字母数字 RCE Payload 在线生成</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved === 'dark';
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <div class="brand">
        <h1>无字母数字 RCE Payload 在线生成</h1>
      </div>
      <button
        id="themeToggle"
        class="theme-switch"
        role="switch"
        aria-checked="false"
        aria-label="切换深浅色主题"
        title="切换深浅色主题"
      >
        <span class="theme-switch__thumb"></span>
      </button>
    </div>
  </header>

  <main class="main">
    <section class="card intro">
      <p>原理：被过滤的字母数字，可用 PHP 位运算从可见字符拼出——<code>~</code> 取反、<code>^</code> 异或、<code>|</code> 或运算逐字节组合出目标字符。拼出函数名和参数后，借助 PHP 的<strong>动态函数调用</strong>（<code>"函数名"(参数)</code> 会被当作调用该函数）来执行。</p>
    </section>

    <section class="card">
      <div class="field">
        <label for="method">生成方式</label>
        <select id="method" class="select">
          <option value="not">~ 取反运算</option>
          <option value="xor">^ 异或运算</option>
          <option value="or">| 或运算</option>
        </select>
      </div>

      <div class="field">
        <label for="funcInput">函数名</label>
        <input id="funcInput" class="input" type="text" value="assert" placeholder="例如：assert" />
      </div>

      <div class="field">
        <label for="paramInput">参数 / 表达式</label>
        <input id="paramInput" class="input" type="text" value="system('whoami')" placeholder="例如：system('whoami') 或 phpinfo();" />
        <div id="paramHint" class="note hidden">当前为无参，将输出 <code>()</code></div>
      </div>

      <label class="checkbox-label">
        <input id="autoSemicolon" type="checkbox" checked />
        末尾自动添加分号
      </label>

      <div class="examples">
        <span class="examples-title">快速示例</span>
        <div class="examples-list">
          <button data-example="not-phpinfo">(~) phpinfo → (~%..%..)();</button>
          <button data-example="not-assert-whoami">(~) assert + system('whoami')</button>
          <button data-example="xor-assert-whoami">(^) assert + system('whoami')</button>
          <button data-example="or-assert-phpinfo">(|) assert + phpinfo();</button>
        </div>
      </div>

    </section>

    <section class="card output">
      <div class="output-header">
        <label for="output">生成结果</label>
        <button id="copyBtn2" class="btn btn--small">复制</button>
      </div>
      <textarea id="output" class="output-box" rows="8" wrap="off" readonly spellcheck="false"></textarea>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="./assets/app.js"></script>
</body>
</html>
